name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_BASE: /luxmily/
          # The Cloudflare Worker that proxies Luxmi's AI calls to Cloudflare
          # Workers AI. Store the deployed worker's URL (no trailing slash) in
          # a GitHub Actions VARIABLE named LUXMI_WORKER_URL, e.g.
          #   https://luxmily-worker.vish-ganapathy.workers.dev
          # (The Actions `secrets.*` fallback is also accepted for backwards
          # compatibility with setups that put it in secrets instead.)
          VITE_LUXMI_WORKER: ${{ secrets.LUXMI_WORKER_URL || vars.LUXMI_WORKER_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4