name = "luxmily-worker"
main = "src/index.js"
compatibility_date = "2024-10-01"

# ── Environment ─────────────────────────────────────────────────────
# Talks to Cloudflare Workers AI over its OpenAI-compatible endpoint:
#   https://api.cloudflare.com/client/v4/accounts/<ACCOUNT_ID>/ai/v1/chat/completions
#
# Wrangler secrets (NOT committed — set with `npx wrangler secret put`):
#   CF_ACCOUNT_ID    = Cloudflare account id (dash.cloudflare.com → profile)
#   CF_AI_API_TOKEN  = API token with "Workers AI — Edit" permission
#     echo "<account-id>" | npx wrangler secret put CF_ACCOUNT_ID
#     echo "<api-token>"   | npx wrangler secret put CF_AI_API_TOKEN
#
# Wrangler vars (safe to commit, non-sensitive):
#   CFAI_MODEL      = Workers AI model id (see developers.cloudflare.com/workers-ai/models/)
#   CFAI_BUDGET_USD = budget cap in USD (for estimated balance display)
#   CFAI_IN_PRICE   = per-1M input-token price in USD (default: 0.051)
#   CFAI_OUT_PRICE  = per-1M output-token price in USD (default: 0.335)
# ────────────────────────────────────────────────────────────────────

[vars]
CFAI_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
CFAI_BUDGET_USD = "25"
CFAI_IN_PRICE = "0.051"
CFAI_OUT_PRICE = "0.335"

# ── Durable Object ──────────────────────────────────────────────────
[durable_objects]
bindings = [{ name = "BALANCE", class_name = "BalanceDO" }]

[[migrations]]
tag = "v1"
new_classes = ["BalanceDO"]